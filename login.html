<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PalaTrip | Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header class="navbar">

        <div class="logo">PalaTrip</div>

        <nav>
            <a href="landing.html">Landing</a>
            <a href="index.html">Home</a>
            <a href="login.html" class="active">Login</a>
            <a href="register.html">Register</a>
        </nav>

    </header>

    <main>

        <section class="form-section">

            <h1>
                Welcome Back
            </h1>

            <p>
                Login to your PalaTrip account.
            </p>

            <form action="profile.html">

                <div>

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div>

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            <p>
                Don't have an account?
                <a href="register.html">Register here</a>
            </p>

        </section>

    </main>

    <footer>

        <p>© 2026 PalaTrip</p>

        <p>Web Systems Project</p>

    </footer>

</body>

</html>
