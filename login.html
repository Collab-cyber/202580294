<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Travel Packing Dashboard</title>
</head>

<body>

    <header>

        <div>
            ✈️ Smart Travel
        </div>

        <nav>
            <a href="landing.html">Landing</a>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>

    </header>

    <main>

        <section>

            <h1>
                Welcome Back!
            </h1>

            <p>
                Log in to your Smart Travel account
                and continue planning your trip.
            </p>

            <form>

                <div>

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div>

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div>

                    <input
                        type="checkbox"
                        id="remember"
                        name="remember"
                    >

                    <label for="remember">
                        Remember Me
                    </label>

                </div>


                <div>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button type="submit">
                    Login
                </button>

            </form>


            <p>
                Don't have an account?
                <a href="register.html">Create an Account</a>
            </p>

        </section>

    </main>

    <footer>

        <p>
            © 2026 Smart Travel Packing Dashboard
        </p>

        <p>
            Web Systems and Technologies Project
        </p>

    </footer>

</body>

</html>
