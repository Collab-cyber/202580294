<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PalaTrip | Register</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header class="navbar">

        <div class="logo">PalaTrip</div>

        <nav>
            <a href="landing.html">Landing</a>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html" class="active">Register</a>
        </nav>

    </header>

    <main>

        <section class="form-section">

            <h1>Create an Account</h1>

            <p>Register to start exploring Palawan with PalaTrip.</p>

            <form>

                <div>
                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div>
                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div>
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >
                </div>

                <div>
                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm your password"
                        required
                    >
                </div>

                <button type="submit">
                    Register
                </button>

            </form>

            <p>
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </section>

    </main>

    <footer>

        <p>© 2026 PalaTrip</p>

        <p>Web Systems Project</p>

    </footer>

</body>

</html>
