<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration - Smart Travel Packing Dashboard</title>
</head>

<body>

    <header>

        <div>
            ✈️ Smart Travel
        </div>

        <nav>
            <a href="landing.html">Landing</a>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>

    </header>


    <main>

        <section>

            <h1>
                Create Your Account
            </h1>

            <p>
                Register your account and start planning
                your trips smarter.
            </p>

            <form>

                <div>

                    <label for="fullname">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div>

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div>

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>

                <div>

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm your password"
                        required
                    >

                </div>

                <button type="submit">
                    Create Account
                </button>

            </form>


            <p>
               Already have an account?
               <a href="login.html">Login</a>
            </p>

        </section>

    </main>

    <footer>

        <p>
            © 2026 Smart Travel Packing Dashboard
        </p>

        <p>
            Web Systems and Technologies Project
        </p>

    </footer>

</body>

</html>
